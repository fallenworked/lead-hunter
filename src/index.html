<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Hunter DEBUG</title>
<style>
  body{font-family:monospace;background:#000;color:#0f0;padding:20px;font-size:13px;line-height:1.5}
  button{padding:12px 20px;font-size:16px;background:#0f0;color:#000;border:0;border-radius:8px;font-weight:bold;margin-bottom:16px}
  pre{white-space:pre-wrap;word-break:break-all;background:#111;padding:12px;border-radius:8px;border:1px solid #333}
  .err{color:#f66}
</style>
</head>
<body>
<h1 style="color:#0f0;margin-bottom:12px">DEBUG</h1>
<button id="go">▶ ЗАПУСТИТЬ</button>
<pre id="out">нажми кнопку…</pre>
<script>
const out = document.getElementById('out');
const log = (m, cls) => {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = m;
  out.appendChild(line);
};

async function run() {
  out.innerHTML = '';
  const t0 = Date.now();
  log('[' + new Date().toLocaleTimeString() + '] старт');

  try {
    log('URL: /api/leads');
    log('fetch…');

    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 25000);

    const r = await fetch('/api/leads?_=' + Date.now(), { signal: ctrl.signal });
    clearTimeout(timeout);

    log('✓ статус: ' + r.status + ' ' + r.statusText, 'ok');
    log('✓ время: ' + (Date.now() - t0) + ' ms');

    const ct = r.headers.get('content-type');
    log('✓ content-type: ' + ct);

    const text = await r.text();
    log('✓ длина ответа: ' + text.length + ' символов');

    if (text.startsWith('<')) {
      log('⚠ ПРИШЁЛ HTML, не JSON! Первые 200:', 'err');
      log(text.slice(0, 200), 'err');
    } else {
      try {
        const data = JSON.parse(text);
        log('✓ JSON ок. count=' + data.count + ', sources=' + JSON.stringify(data.sources));
        log('✓ debug: ' + JSON.stringify(data.debug, null, 2));
        log('✓ первые 3 лида:');
        (data.leads || []).slice(0, 3).forEach(l => log('  · ' + l.title.slice(0,80)));
      } catch (e) {
        log('⚠ не JSON: ' + e.message, 'err');
        log(text.slice(0, 500), 'err');
      }
    }
  } catch(e) {
    log('✗ ОШИБКА через ' + (Date.now() - t0) + ' ms', 'err');
    log('name: ' + e.name, 'err');
    log('message: ' + e.message, 'err');
  }
}

document.getElementById('go').addEventListener('click', run);
run();
</script>
</body>
</html>
